# Streamlit Community Cloud는 12시간 동안 트래픽이 없으면 앱을 재웁니다.
# 잠들면 방문자가 "Yes, get this app back up!"을 누르고 40초쯤 기다려야 합니다.
#
# 중요: Streamlit은 HTTP 요청이 아니라 실제 세션(WebSocket /_stcore/stream 연결)만
#       트래픽으로 셉니다. curl로 페이지를 받아오면 HTML 껍데기만 올 뿐 파이썬
#       프로세스가 뜨지 않아 아무 소용이 없습니다. 그래서 헤드리스 브라우저로
#       실제 접속시킵니다.
#
# 12시간 한도에 GitHub 예약 지연(관측상 최대 2시간)까지 감안해 4시간마다 돕니다.

name: "3. 대시보드 깨우기"

on:
  schedule:
    # UTC 기준 4시간마다. 정각은 전 세계 작업이 몰려 밀리므로 :17로 둡니다.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v5

      - name: 파이썬 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Playwright 설치
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: 대시보드 접속해서 깨우기
        env:
          APP_URL: https://lotto007.streamlit.app
        run: python -u scripts/keep_awake.py

      - name: 실패 화면 보관
        # 깨우기에 실패했을 때 무엇이 떠 있었는지 남깁니다.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: keep-awake-failure-${{ github.run_number }}
          path: keep_awake_failure.png
          retention-days: 7
          if-no-files-found: ignore
